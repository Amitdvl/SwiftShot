<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83dff2"/>
      <stop offset="0.48" stop-color="#dce8f7"/>
      <stop offset="1" stop-color="#ff9870"/>
    </linearGradient>
    <radialGradient id="light" cx="0.18" cy="0.16" r="0.76">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="desktopBlur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="imageBlur"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#182433" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#182433" flood-opacity="0.18"/>
    </filter>
    <filter id="buttonShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d1722" flood-opacity="0.3"/>
    </filter>
    <clipPath id="imageClip"><rect x="180" y="210" width="840" height="500" rx="24"/></clipPath>
  </defs>

  <!-- Desktop context -->
  <rect width="1200" height="1200" fill="url(#desk)"/>
  <ellipse cx="170" cy="200" rx="300" ry="210" fill="#d9fbff" opacity="0.65" filter="url(#desktopBlur)"/>
  <ellipse cx="1060" cy="970" rx="280" ry="230" fill="#ff7f91" opacity="0.32" filter="url(#desktopBlur)"/>
  <rect width="1200" height="1200" fill="url(#light)"/>

  <!-- Borderless, frameless image surface -->
  <g filter="url(#shadow)">
    <g clip-path="url(#imageClip)">
      <rect x="180" y="210" width="840" height="500" fill="#f0f2f5"/>
      <!-- Screenshot content is deliberately blurred only in the hover state -->
      <g filter="url(#imageBlur)">
        <rect x="200" y="230" width="800" height="460" rx="14" fill="#ffffff" stroke="#d6dce3" stroke-width="2"/>
        <rect x="200" y="230" width="800" height="48" fill="#f7f8fa"/>
        <circle cx="224" cy="254" r="6" fill="#d3d9df"/>
        <circle cx="244" cy="254" r="6" fill="#d3d9df"/>
        <circle cx="264" cy="254" r="6" fill="#d3d9df"/>
        <rect x="310" y="247" width="230" height="13" rx="6.5" fill="#dce2e8"/>
        <rect x="260" y="326" width="410" height="17" rx="8.5" fill="#29343f" opacity="0.9"/>
        <rect x="260" y="365" width="650" height="10" rx="5" fill="#7a858e" opacity="0.6"/>
        <rect x="260" y="389" width="585" height="10" rx="5" fill="#7a858e" opacity="0.5"/>
        <rect x="260" y="413" width="620" height="10" rx="5" fill="#7a858e" opacity="0.5"/>
        <rect x="260" y="437" width="480" height="10" rx="5" fill="#7a858e" opacity="0.5"/>
        <rect x="260" y="492" width="260" height="13" rx="6.5" fill="#ff7a42" opacity="0.75"/>
        <rect x="260" y="528" width="600" height="10" rx="5" fill="#7a858e" opacity="0.46"/>
        <rect x="260" y="552" width="640" height="10" rx="5" fill="#7a858e" opacity="0.46"/>
        <rect x="260" y="576" width="420" height="10" rx="5" fill="#7a858e" opacity="0.46"/>
        <rect x="260" y="626" width="160" height="30" rx="15" fill="#ffede5"/>
        <text x="340" y="647" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="650" fill="#d55b31">Screenshot</text>
      </g>
      <!-- restrained hover veil preserves the screenshot while separating controls -->
      <rect x="180" y="210" width="840" height="500" fill="#17212b" opacity="0.11"/>

      <!-- Four corner controls, inside the image bounds -->
      <g filter="url(#buttonShadow)">
        <!-- Copy: top-left -->
        <rect x="202" y="232" width="54" height="54" rx="16" fill="#17212b" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.28"/>
        <rect x="218" y="246" width="15" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
        <rect x="223" y="251" width="15" height="18" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
        <!-- Save: top-right -->
        <rect x="944" y="232" width="54" height="54" rx="16" fill="#17212b" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.28"/>
        <path d="M960 247h18l7 7v17h-25zM964 247v9h11v-9M965 271h13" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
        <!-- Edit: bottom-left -->
        <rect x="202" y="634" width="54" height="54" rx="16" fill="#17212b" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.28"/>
        <path d="M218 670l2-9 17-17 7 7-17 17zM237 647l7 7M218 670h9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Close: bottom-right -->
        <rect x="944" y="634" width="54" height="54" rx="16" fill="#17212b" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.28"/>
        <path d="M961 651l20 20m0-20-20 20" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
      </g>
    </g>
    <!-- Hover pointer cue -->
    <path d="M595 428l22 50 12-19 22 9-56-40z" fill="#ffffff" stroke="#17212b" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
